name: CI — National Labor Platform

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check (strict)
        run: npm run type-check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Security audit (advisory)
        run: npm audit --audit-level=critical || echo "::warning::audit findings present"
