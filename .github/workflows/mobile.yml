name: Mobile App CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile/**'

env:
  NODE_VERSION: '18'
  JAVA_VERSION: '17'
  EXPO_VERSION: '~6.3.0'

jobs:
  # ============================================
  # Lint and Type Check
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint || true

      - name: TypeScript check
        run: npx tsc --noEmit

  # ============================================
  # Android Build
  # ============================================
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Install Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: |
          gem install fastlane -v 2.216.0
          fastlane --version

      - name: Build Android (Debug)
        run: |
          npx expo run:android --variant debug --no-install || true
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Generate JS Bundle
        run: |
          npx expo export --platform android || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 7

  # ============================================
  # iOS Build (requires MacOS)
  # ============================================
  ios-build:
    name: iOS Build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup iOS pods
        run: npx pod-install --ios_simulators_only=true || true
        timeout-minutes: 30

      - name: Build iOS (Debug Simulator)
        run: |
          # Create simulator build
          xcodebuild -workspace ios/*.xcworkspace -scheme NLPApp -configuration Debug -destination "platform=iOS Simulator,name=iPhone 15" build CODE_SIGNING_ALLOWED=NO || true
        timeout-minutes: 30

      - name: Generate JS Bundle
        run: npx expo export --platform ios || true

  # ============================================
  # Unit Tests
  # ============================================
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests || true

  # ============================================
  # E2E Tests (Detox)
  # ============================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [android-build]
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Install Detox
        run: npm install -g detox-cli || true

      - name: Build Detox tests
        run: |
          cd android && ./gradlew assembleDebug
          cd ..
          detox build --configuration android.emu.debug || true

      - name: Run Detox tests
        run: |
          detox test --configuration android.emu.debug --record-videos never || true
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        timeout-minutes: 30

  # ============================================
  # Build Production App
  # ============================================
  android-release:
    name: Android Release Build
    runs-on: ubuntu-latest
    needs: [lint, tests]
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Install Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: |
          gem install fastlane -v 2.216.0
          fastlane --version

      - name: Build Android Release
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android/app/nlp-release.keystore
          npx expo run:android --variant release --no-install || true
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/**/*.aab
          retention-days: 30

      - name: Upload Play Console
        if: github.event_name == 'push'
        run: |
          # In production, upload to Play Console
          # fastlane supply --package_name com.mol.yemen.nlp --track production --json_key ./fastlane/json_key.json --aab android/app/build/outputs/bundle/release/app-release.aab
          echo "Play Console upload simulated"

  # ============================================
  # Build iOS Production (requires MacOS)
  # ============================================
  ios-release:
    name: iOS Production Build
    runs-on: macos-latest
    needs: [lint, tests]
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup iOS pods
        run: npx pod-install || true
        timeout-minutes: 30

      - name: Build iOS Production
        run: |
          # In production, use Fastlane
          # fastlane beta
          xcodebuild -workspace ios/*.xcworkspace -scheme NLPApp -configuration Release -destination "generic/platform=iOS" build CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO || true
        timeout-minutes: 60

      - name: Upload to TestFlight
        if: github.event_name == 'push'
        run: |
          # In production, upload to TestFlight/App Store
          # fastlane pilot distribute --skip_waiting_for_build_processing
          echo "TestFlight upload simulated"
