name: Deploy to Production

# Multi-environment deployment with health gates, smoke tests, and rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip CI tests (for emergency hotfix)'
        required: false
        default: false
        type: boolean
      commit_sha:
        description: 'Specific commit SHA (default: current HEAD)'
        required: false
        default: ''
        type: string

env:
  NODE_VERSION: '20'
  DOCKER_IMAGE: 'molyemen/nlp-platform'
  REGISTRY: 'ghcr.io'

jobs:
  # ============ Pre-flight checks ============
  pre-flight:
    name: 🚦 Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.sha.outputs.sha }}
      environment: ${{ steps.env.outputs.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set commit SHA
        id: sha
        run: |
          SHA="${{ inputs.commit_sha || github.sha }}"
          echo "sha=$SHA" >> $GITHUB_OUTPUT
      - name: Validate environment
        id: env
        run: |
          ENV="${{ inputs.environment }}"
          echo "env=$ENV" >> $GITHUB_OUTPUT
          if [[ "$ENV" == "production" && "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "❌ Production deploys are only allowed from main branch"
            exit 1
          fi
          echo "✅ Deploying $ENV from $SHA"

  # ============ Build Stage ============
  build:
    name: 🏗️ Build & Package
    runs-on: ubuntu-latest
    needs: pre-flight
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pre-flight.outputs.commit_sha }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '8.15.9'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Server syntax check
        run: pnpm run check:server

      - name: Build frontend
        run: pnpm build

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NODE_VERSION=${{ env.NODE_VERSION }} \
            --tag ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ needs.pre-flight.outputs.commit_sha }} \
            --tag ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE }}:latest \
            .

      - name: Push to registry
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin
          docker push ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ needs.pre-flight.outputs.commit_sha }}
          docker push ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE }}:latest

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info-${{ needs.pre-flight.outputs.environment }}
          path: |
            .dockerignore
            Dockerfile
          retention-days: 1

  # ============ Deploy to Environment ============
  deploy:
    name: 🚀 Deploy to ${{ needs.pre-flight.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [pre-flight, build]
    environment:
      name: ${{ needs.pre-flight.outputs.environment }}
      url: ${{ needs.pre-flight.outputs.environment == 'production' && 'https://unionsphere.vercel.app' || 'https://staging.unionsphere.vercel.app' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel (staging)
        if: needs.pre-flight.outputs.environment == 'staging'
        run: |
          echo "Deploying to staging..."
          # Use Vercel CLI for staging deployment
          npx vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --prod=false \
            --yes \
            --build-env NODE_VERSION=${{ env.NODE_VERSION }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (production)
        if: needs.pre-flight.outputs.environment == 'production'
        run: |
          echo "Deploying to production..."
          npx vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --prod=true \
            --yes \
            --build-env NODE_VERSION=${{ env.NODE_VERSION }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Save deployment URL
        id: deploy
        run: |
          echo "url=${{ needs.pre-flight.outputs.environment == 'production' && 'https://unionsphere.vercel.app' || 'https://staging.unionsphere.vercel.app' }}" >> $GITHUB_OUTPUT

  # ============ Smoke Tests after Deploy ============
  smoke-tests:
    name: 🔬 Post-deploy Smoke Tests
    runs-on: ubuntu-latest
    needs: [pre-flight, deploy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for deployment
        run: sleep 15

      - name: Smoke test — health endpoint
        run: |
          URL="${{ needs.pre-flight.outputs.environment == 'production' && 'https://unionsphere.vercel.app' || 'https://staging.unionsphere.vercel.app' }}"
          echo "Testing $URL"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/health" --max-time 10)
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ]; then
            echo "✅ Health endpoint responds: $HTTP_CODE"
          else
            echo "❌ Health check failed: $HTTP_CODE"
            exit 1
          fi

      - name: Smoke test — frontend loads
        run: |
          URL="${{ needs.pre-flight.outputs.environment == 'production' && 'https://unionsphere.vercel.app' || 'https://staging.unionsphere.vercel.app' }}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/" --max-time 15 --location)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Frontend loads: $HTTP_CODE"
          else
            echo "⚠️  Frontend response: $HTTP_CODE (may be redirect or SPA)"
          fi

  # ============ Database Migration (production only) ============
  db-migrate:
    name: 🗄️ Run DB Migrations
    runs-on: ubuntu-latest
    needs: [pre-flight]
    if: needs.pre-flight.outputs.environment == 'production'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pre-flight.outputs.commit_sha }}

      - name: Run migrations
        run: |
          echo "Applying database migrations..."
          node scripts/apply-migration.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ============ Final Status ============
  deploy-complete:
    name: ✅ Deployment Complete
    runs-on: ubuntu-latest
    needs: [pre-flight, deploy, smoke-tests]
    if: always()
    steps:
      - name: Deployment result
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ Deployment failed"
            exit 1
          fi
          echo "🎉 Successfully deployed to ${{ needs.pre-flight.outputs.environment }}"
          echo "📝 Commit: ${{ needs.pre-flight.outputs.commit_sha }}"
          echo "🔗 URL: ${{ needs.pre-flight.outputs.environment == 'production' && 'https://unionsphere.vercel.app' || 'https://staging.unionsphere.vercel.app' }}"
