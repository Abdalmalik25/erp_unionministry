openapi: 3.0.3
info:
  title: National Labor Platform API
  description: |
    # Yemen National Labor Platform API
    
    Comprehensive API for managing labor relations, worker records, employer registrations,
    union management, inspections, compliance monitoring, and national occupational directories.
    
    ## Authentication
    All endpoints (except health and public dictionaries) require Bearer token authentication.
    Tokens are obtained via `/api/auth/login` and should be included in the Authorization header.
    
    ## Rate Limiting
    - Public endpoints: 60 requests/minute
    - Worker endpoints: 120 requests/minute
    - Employer/Union endpoints: 300 requests/minute
    - Ministry/Admin endpoints: 600 requests/minute
    
    ## Standard Response Format
    ```json
    {
      "success": true,
      "data": { ... },
      "meta": {
        "timestamp": "2026-08-29T18:00:00.000Z",
        "path": "/api/entities",
        "method": "GET"
      },
      "errors": null
    }
    ```
    
    ## Error Response Format
    ```json
    {
      "success": false,
      "data": null,
      "meta": { ... },
      "errors": { "code": "ERROR_CODE", "message": "Human readable message" }
    }
    ```
  version: 2.0.0
  contact:
    name: Ministry of Labor - Yemen
    email: api-support@mol.gov.ye
  license:
    name: Government Use Only
    url: https://mol.gov.ye/license
  x-api-key-supported: true
  x-oauth2-supported: true

servers:
  - url: https://api.labor.gov.ye/v2
    description: Production Server
  - url: https://staging-api.labor.gov.ye/v2
    description: Staging Server
  - url: http://localhost:4000/api
    description: Local Development

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Health
    description: System health and status endpoints
  - name: Dashboard
    description: Dashboard statistics and analytics
  - name: Entities
    description: Organizational entities (unions, employers)
  - name: Members
    description: Entity member management
  - name: Activities
    description: Union and organization activities
  - name: Elections
    description: Union elections management
  - name: Documents
    description: Document management
  - name: Workers
    description: Worker profiles and records
  - name: Employers
    description: Employer management
  - name: Inspections
    description: Labor inspections
  - name: Compliance
    description: Compliance alerts and monitoring
  - name: Licenses
    description: Work permits and licenses
  - name: Contracts
    description: Labor contracts
  - name: Payments
    description: Fee payments and financial transactions
  - name: Disputes
    description: Labor disputes resolution
  - name: National Directories
    description: ISIC-4, occupations, and national standards
  - name: Training
    description: Training records and programs
  - name: Notifications
    description: System notifications
  - name: Audit
    description: Audit logging
  - name: Intelligence
    description: AI-powered analytics and recommendations
  - name: External Integrations
    description: Third-party system integrations
  - name: Data Quality
    description: Data quality monitoring
  - name: Excellence
    description: Excellence framework management

paths:
  # ==================== Health & System ====================
  /health:
    get:
      tags: [Health]
      summary: Health check endpoint
      description: Returns system health status and database connectivity
      security: []
      responses:
        '200':
          description: System healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  database:
                    type: string
                    enum: [connected, disconnected]
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
        '503':
          description: System unhealthy

  # ==================== Authentication ====================
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate user and receive JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                description: Session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: User logout
      description: Invalidate current session and token
      responses:
        '200':
          description: Logout successful
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current user
      description: Returns current authenticated user information
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/mfa/verify:
    post:
      tags: [Authentication]
      summary: Verify MFA code
      description: Verify TOTP or SMS MFA code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, sessionId]
              properties:
                code:
                  type: string
                  description: MFA verification code
                sessionId:
                  type: string
                  description: Session ID from login
      responses:
        '200':
          description: MFA verified
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Exchange refresh token for new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change password
      description: Change current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 12
      responses:
        '200':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== Dashboard ====================
  /dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Dashboard statistics
      description: Aggregate statistics for dashboard display
      parameters:
        - $ref: '#/components/parameters/Governorate'
        - $ref: '#/components/parameters/DateRange'
      responses:
        '200':
          description: Dashboard statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalWorkers:
                    type: integer
                  totalEmployers:
                    type: integer
                  totalUnions:
                    type: integer
                  pendingInspections:
                    type: integer
                  activeContracts:
                    type: integer
                  complianceRate:
                    type: number
                    format: float
                  recentActivity:
                    type: array
                    items:
                      $ref: '#/components/schemas/Activity'

  /dashboard/enhanced-stats:
    get:
      tags: [Dashboard]
      summary: Enhanced dashboard statistics
      description: Extended statistics including trends and predictions
      parameters:
        - $ref: '#/components/parameters/Governorate'
        - $ref: '#/components/parameters/DateRange'
        - name: includePredictions
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Enhanced statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnhancedStats'

  # ==================== Entities ====================
  /entities:
    get:
      tags: [Entities]
      summary: List entities
      description: Get paginated list of organizational entities
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Governorate'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/EntityType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EntityStatus'
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated entity list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Entity'

    post:
      tags: [Entities]
      summary: Create entity
      description: Register a new organizational entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityCreate'
      responses:
        '201':
          description: Entity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'

  /entities/{id}:
    get:
      tags: [Entities]
      summary: Get entity by ID
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Entity details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Entities]
      summary: Update entity
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityUpdate'
      responses:
        '200':
          description: Entity updated
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Entities]
      summary: Soft delete entity
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Entity deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /entities/{id}/members:
