# ==================== Components ====================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for service-to-service communication
    csrf:
      type: apiKey
      in: header
      name: x-csrf-token
      description: CSRF token for state-changing operations

  # ==================== Parameters ====================
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number for pagination

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Number of items per page

    Governorate:
      name: governorate
      in: query
      schema:
        type: string
      description: Filter by governorate code

    DateRange:
      name: dateRange
      in: query
      schema:
        type: string
        enum: [today, week, month, quarter, year, custom]
      description: Date range filter

    EntityId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Entity UUID

  # ==================== Responses ====================
  responses:
    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              errors:
                type: object
                properties:
                  code:
                    type: string
                    example: UNAUTHORIZED
                  message:
                    type: string
                    example: Authentication required

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              errors:
                type: object
                properties:
                  code:
                    type: string
                    example: FORBIDDEN
                  message:
                    type: string
                    example: Insufficient permissions

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              errors:
                type: object
                properties:
                  code:
                    type: string
                    example: NOT_FOUND
                  message:
                    type: string
                    example: Resource not found

    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              errors:
                type: object
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              errors:
                type: object
                properties:
                  code:
                    type: string
                    example: RATE_LIMITED
                  message:
                    type: string
                    example: Too many requests, please try again later
                  retryAfter:
                    type: integer
                    description: Seconds until rate limit resets

  # ==================== Schemas ====================
  schemas:
    # Base Types
    BaseEntity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        deletedAt:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean

    PaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    # Enums
    EntityType:
      type: string
      enum: [union, employer, cooperative, professional_association]
      description: Type of organizational entity

    EntityStatus:
      type: string
      enum: [active, inactive, suspended, under_investigation, dissolved]
      description: Entity registration status

    MemberStatus:
      type: string
      enum: [active, suspended, expelled, deceased]
      description: Member status

    ActivityType:
      type: string
      enum: [meeting, training, event, protest, negotiation, other]
      description: Activity type

    ElectionStatus:
      type: string
      enum: [scheduled, nomination, voting, completed, cancelled]
